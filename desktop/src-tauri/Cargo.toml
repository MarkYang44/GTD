[package]
name = "gtd"
version = "0.1.0"
edition = "2021"
description = "GTD desktop media downloader"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading",
] }
