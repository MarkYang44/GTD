<label class="theme-toggle" for="theme-toggle">
        <span data-guide-copy="zh" lang="zh-CN">深色</span><span data-guide-copy="en" lang="en">Dark</span>
        <input id="theme-toggle"
               type="checkbox"
               role="switch"
               data-i18n-aria-label-zh="浅色主题"
               data-i18n-aria-label-en="Light theme"
               aria-label="浅色主题">
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb"></span>
        </span>
        <span data-guide-copy="zh" lang="zh-CN">浅色</span><span data-guide-copy="en" lang="en">Light</span>
      </label>
